<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaHub - Upload</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">MediaHub</div>
  <nav>
    <a href="index.html">Browse</a>
    <a href="upload.html" class="active">Upload</a>
  </nav>
</header>

<main>
  <h1>Upload media</h1>
  <p class="subtitle">JPEG, PNG, or WEBP. Max 10 MB.</p>

  <form id="form" style="max-width:560px">
    <label for="title">Title</label>
    <input id="title" type="text" required placeholder="e.g. Sunset over Belfast">

    <label for="visibility">Visibility</label>
    <select id="visibility">
      <option value="public">Public</option>
      <option value="unlisted">Unlisted</option>
      <option value="private">Private</option>
    </select>

    <label for="file">File</label>
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp" required>

    <div style="margin-top:20px">
      <button id="submit" class="btn" type="submit">Upload</button>
    </div>
  </form>

  <div id="status" class="upload-status" hidden></div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
const form     = document.getElementById("form");
const submit   = document.getElementById("submit");
const statusEl = document.getElementById("status");

function step(text, cls) {
  const div = document.createElement("div");
  div.className = "step " + (cls || "");
  div.textContent = text;
  statusEl.appendChild(div);
  return div;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const title    = document.getElementById("title").value.trim();
  const vis      = document.getElementById("visibility").value;
  const fileEl   = document.getElementById("file");
  const file     = fileEl.files[0];
  if (!file) return;

  const ext = file.name.split(".").pop().toLowerCase();

  submit.disabled = true;
  statusEl.hidden = false;
  statusEl.innerHTML = "";

  let s1, s2, s3;
  try {
    s1 = step("1) Reserving media slot via Logic App...", "active");
    const created = await api.createMedia({
      ownerId:       window.MEDIAHUB_CONFIG.DEFAULT_OWNER_ID,
      title,
      fileExtension: ext,
      visibility:    vis
    });
    s1.className = "step done";
    s1.textContent = `1) Reserved slot. mediaId=${created.mediaId}`;

    s2 = step("2) Uploading file directly to blob storage (SAS URL)...", "active");
    await api.uploadFileToSas(created.uploadUrl, file);
    s2.className = "step done";
    s2.textContent = "2) Upload complete. Blob trigger should now fire.";

    s3 = step("3) Waiting for AI pipeline (Vision + Content Safety)...", "active");
    const final = await pollUntilProcessed(created.mediaId);
    s3.className = "step done";
    s3.textContent = `3) Pipeline finished. Status=${final.status}, tags=${(final.tags || []).length}`;

    setTimeout(() => {
      location.href = "detail.html?id=" + encodeURIComponent(created.mediaId);
    }, 1200);

  } catch (err) {
    const errStep = step("Error: " + err.message, "error");
    submit.disabled = false;
  }
});

// Poll GET /media/{id} until status flips from 'pending'
async function pollUntilProcessed(mediaId, maxTries = 30) {
  for (let i = 0; i < maxTries; i++) {
    await new Promise(r => setTimeout(r, 2000));
    try {
      const got = await api.getMedia(mediaId);
      const status = got.mediaItem?.status;
      if (status && status !== "pending") {
        return {
          status,
          tags: got.metadata?.aiLabels || []
        };
      }
    } catch (_) { /* keep trying */ }
  }
  return { status: "pending", tags: [] };
}
</script>
</body>
</html>
