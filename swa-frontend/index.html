<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaHub - Browse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">MediaHub</div>
  <nav>
    <a href="index.html" class="active">Browse</a>
    <a href="upload.html">Upload</a>
  </nav>
</header>

<main>
  <h1>Browse media</h1>
  <p class="subtitle">All public uploads. Click any item to view, edit or delete.</p>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    <p>No media yet. <a href="upload.html">Upload the first one</a>.</p>
  </div>
  <div id="loading" class="empty"><p>Loading…</p></div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async function () {
  const grid = document.getElementById("grid");
  const loading = document.getElementById("loading");
  const empty = document.getElementById("empty");

  try {
    const items = await api.listMedia();
    loading.hidden = true;

    if (!items || items.length === 0) {
      empty.hidden = false;
      return;
    }

    grid.innerHTML = items.map(m => `
      <div class="card" onclick="location.href='detail.html?id=${encodeURIComponent(m.mediaId)}'">
        <div class="thumb" style="background-image:url('${thumbUrl(m.mediaId)}')"></div>
        <div class="meta">
          <div class="title">${escapeHtml(m.title)}</div>
          <div class="sub">
            <span>${new Date(m.createdAt).toLocaleDateString()}</span>
            ${statusPill(m.status)}
          </div>
        </div>
      </div>
    `).join("");
  } catch (err) {
    loading.hidden = true;
    grid.innerHTML = `<p style="color:var(--danger)">Failed to load: ${escapeHtml(err.message)}</p>`;
  }
})();
</script>
</body>
</html>
