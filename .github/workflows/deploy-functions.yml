name: Deploy MediaHub Function App

on:
  push:
    branches: [ main ]
    paths:
      - 'mediahub-functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd mediahub-functions
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip function app
        run: |
          cd mediahub-functions
          zip -r ../mediahub-fn2.zip . \
            --exclude "*.pyc" \
            --exclude "__pycache__/*" \
            --exclude ".venv/*" \
            --exclude "local.settings.json"

      - name: Deploy via Kudu REST API
        run: |
          curl -X POST \
            "https://mediahub-fn2.scm.azurewebsites.net/api/zipdeploy" \
            -u "${{ secrets.AZURE_KUDU_USER }}:${{ secrets.AZURE_KUDU_PASS }}" \
            -H "Content-Type: application/zip" \
            --data-binary @../mediahub-fn2.zip \
            --fail \
            -v
