name: Deploy MediaHub Function App

on:
  push:
    branches: [ main ]
    paths:
      - 'mediahub-functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions via ZIP
        run: |
          cd mediahub-functions
          zip -r ../deploy.zip . -x "*.pyc" -x "__pycache__/*" -x ".venv/*" -x "local.settings.json"
          az functionapp deployment source config-zip \
            --resource-group rg-mediahub \
            --name mediahub-functions \
            --src ../deploy.zip \
            --subscription ebd89ab8-019b-4262-99f4-e055c58a641e
